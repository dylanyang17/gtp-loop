services:
  nr_ue2:
    build: ../open5gs/ueransim
    image: docker_ueransim
    container_name: double_upf_nr_ue2
    command: /mnt/ueransim/ueransim-ue2_init.sh
    stdin_open: true
    tty: true
    volumes:
      - ./ueransim:/mnt/ueransim
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=ueransim-ue2
    expose:
      - "4997/udp"
    cap_add:
      - NET_ADMIN
    privileged: true
    networks:
      default:
        ipv4_address: ${NR_UE2_IP}
networks:
  default:
    external: true
    name: double_upf_open5gs_default
