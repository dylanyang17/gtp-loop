logger:
  file:
    path: /open5gs/install/var/log/open5gs/v-sepp.log
  level: info   # fatal|error|warn|info(default)|debug|trace

info:
  port:
    http: 7777

sbi:
    server:
      no_tls: true
    client:
      no_tls: true

global:
  max:
    ue: MAX_NUM_UE  # The number of UE can be increased depending on memory size.
#    peer: 64

sepp:
  sbi:
    server:
      - address: sepp.5gc.mncMNC.mccMCC.3gppnetwork.org
        port: 7777
    client:
      scp:
        - uri: http://scp.5gc.mncMNC.mccMCC.3gppnetwork.org:7777
  n32:
    server:
      - sender: sepp.5gc.mncMNC.mccMCC.3gppnetwork.org
    client:
      sepp:
        - receiver: sepp.5gc.mncOMNC.mccOMCC.3gppnetwork.org
          uri: http://sepp.5gc.mncOMNC.mccOMCC.3gppnetwork.org:7777

