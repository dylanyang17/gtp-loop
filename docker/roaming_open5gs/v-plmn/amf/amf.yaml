logger:
  file:
    path: /open5gs/install/var/log/open5gs/v-amf.log
 # level: debug   # fatal|error|warn|info(default)|debug|trace

sbi:
    server:
      no_tls: true
    client:
      no_tls: true

global:
  max:
    ue: MAX_NUM_UE  # The number of UE can be increased depending on memory size.
#    peer: 64

amf:
  sbi:
    server:
      - address: amf.5gc.mncMNC.mccMCC.3gppnetwork.org
        port: 7777
    client:
#      nrf:
#        - uri: http://127.0.0.10:7777
      scp:
        - uri: http://scp.5gc.mncMNC.mccMCC.3gppnetwork.org:7777
  ngap:
    server:
      - address: amf.5gc.mncMNC.mccMCC.3gppnetwork.org
  metrics:
    server:
      - address: amf.5gc.mncMNC.mccMCC.3gppnetwork.org
        port: 9090
  access_control:
    - plmn_id:
        mcc: MCC_NOPREF
        mnc: MNC_NOPREF
    - plmn_id:
        mcc: OMCC_NOPREF
        mnc: OMNC_NOPREF
  guami:
    - plmn_id:
        mcc: MCC_NOPREF
        mnc: MNC_NOPREF
      amf_id:
        region: 2
        set: 1
  tai:
    - plmn_id:
        mcc: MCC_NOPREF
        mnc: MNC_NOPREF
      tac: 1
  plmn_support:
    - plmn_id:
        mcc: MCC_NOPREF
        mnc: MNC_NOPREF
      s_nssai:
        - sst: 1
  security:
    integrity_order : [ NIA2, NIA1, NIA0 ]
    ciphering_order : [ NEA0, NEA1, NEA2 ]
  network_name:
    full: Open5GS
    short: Next
  amf_name: open5gs-amf0
  time:
#    t3502:
#      value: 720   # 12 minutes * 60 = 720 seconds
    t3512:
      value: 540    # 9 minutes * 60 = 540 seconds
    # t3560:
    #   value: 10  # do not release (seems not effective)
