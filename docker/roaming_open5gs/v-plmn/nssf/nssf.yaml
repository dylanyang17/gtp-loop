logger:
  file:
    path: /open5gs/install/var/log/open5gs/v-nssf.log
#  level: info   # fatal|error|warn|info(default)|debug|trace

sbi:
    server:
      no_tls: true
    client:
      no_tls: true

global:
  max:
    ue: MAX_NUM_UE  # The number of UE can be increased depending on memory size.
#    peer: 64

nssf:
  sbi:
    server:
      - address: nssf.5gc.mncMNC.mccMCC.3gppnetwork.org
        port: 7777
    client:
#      nrf:
#        - uri: http://127.0.0.10:7777
      scp:
        - uri: http://scp.5gc.mncMNC.mccMCC.3gppnetwork.org:7777
      nsi:
        - uri: http://nrf.5gc.mncMNC.mccMCC.3gppnetwork.org:7777
          s_nssai:
            sst: 1
