services:
  dns:
    build: ./dns
    container_name: dns
    networks:
      default:
        ipv4_address: ${DNS_IP}
    env_file:
      - .env
    volumes:
      - ./dns/unbound.conf.template:/opt/unbound/etc/unbound/unbound.conf.template:ro
  hdb:
    image: mongo:6.0
    container_name: hdb
    command: --bind_ip 0.0.0.0
    env_file:
      - .env
      - h-plmn/h-plmn.env
    volumes:
      - hdbdata:/data/db
      - hdbdata:/data/configdb
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "27017/udp"
      - "27017/tcp"
    networks:
      default:
        ipv4_address: ${HDB_IP}
  vdb:
    image: mongo:6.0
    container_name: vdb
    command: --bind_ip 0.0.0.0
    env_file:
      - .env
      - v-plmn/v-plmn.env
    volumes:
      - vdbdata:/data/db
      - vdbdata:/data/configdb
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "27017/udp"
      - "27017/tcp"
    networks:
      default:
        ipv4_address: ${VDB_IP}

  hwebui:
    image: docker_open5gs
    container_name: hwebui
    depends_on:
      - hdb
      - dns
    env_file:
      - .env
      - h-plmn/h-plmn.env
    environment:
      - COMPONENT_NAME=webui
    volumes:
      - ./h-plmn/webui:/mnt/webui
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "9999/tcp"
    ports:
      - "9998:9999/tcp"
    networks:
      default:
        ipv4_address: ${HWEBUI_IP}
    dns:
      - ${DNS_IP}
  vwebui:
    image: docker_open5gs
    container_name: vwebui
