logger:
  file:
    path: /open5gs/install/var/log/open5gs/h-udm.log
    level: debug   # fatal|error|warn|info(default)|debug|trace

sbi:
    server:
      no_tls: true
    client:
      no_tls: true

global:
  max:
    ue: MAX_NUM_UE  # The number of UE can be increased depending on memory size.
#    peer: 64

udm:
  hnet:
    - id: 1
      scheme: 1
      key: /open5gs/install/etc/open5gs/hnet/curve25519-1.key
    - id: 2
      scheme: 2
      key: /open5gs/install/etc/open5gs/hnet/secp256r1-2.key
  sbi:
    server:
      - address: udm.5gc.mncMNC.mccMCC.3gppnetwork.org
        port: 7777
    client:
      nrf:
        - uri: http://nrf.5gc.mncMNC.mccMCC.3gppnetwork.org:7777
      scp:
        - uri: http://scp.5gc.mncMNC.mccMCC.3gppnetwork.org:7777
