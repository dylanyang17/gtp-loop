logger:
  file:
    path: /open5gs/install/var/log/open5gs/h-ausf.log
  # level: trace   # fatal|error|warn|info(default)|debug|trace

sbi:
    server:
      no_tls: true
    client:
      no_tls: true

global:
  max:
    ue: MAX_NUM_UE  # The number of UE can be increased depending on memory size.
